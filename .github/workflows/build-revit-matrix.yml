name: Build Revit Sleeve Tools (2020-2027)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Revit ${{ matrix.revit-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit-version: ['2020', '2021', '2022', '2023', '2024', '2025', '2026', '2027']

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore solution
        run: dotnet restore .\RevitSleeveTools_WPF.sln -p:RevitVersion=${{ matrix.revit-version }}

      - name: Build solution
        run: dotnet build .\RevitSleeveTools_WPF.sln --configuration Release --no-restore -p:RevitVersion=${{ matrix.revit-version }}

      - name: Assemble version-specific install package
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ matrix.revit-version }}'
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts/RevitSleeveTools-Revit-$version"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "src/Creation/bin/Release/RevitSleeveAddin.dll" $package
          Copy-Item "src/Documentation/bin/Release/RevitSleeveDocumentation.dll" $package
          @"
          # Revit Sleeve Tools installer
          # Run this script on the target Windows account. Revit must be closed.
          `$ErrorActionPreference = 'Stop'
          `$version = '$version'
          `$target = Join-Path `$env:APPDATA "Autodesk/Revit/Addins/`$version"
          New-Item -ItemType Directory -Path `$target -Force | Out-Null
          Copy-Item (Join-Path `$PSScriptRoot 'RevitSleeveAddin.dll') `$target -Force
          Copy-Item (Join-Path `$PSScriptRoot 'RevitSleeveDocumentation.dll') `$target -Force
          `$creationAssembly = Join-Path `$target 'RevitSleeveAddin.dll'
          `$docAssembly = Join-Path `$target 'RevitSleeveDocumentation.dll'
          `$creation = @'
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <RevitAddIns>
            <AddIn Type="Command">
              <Name>Revit Sleeve Tools - Create Sleeves</Name>
              <Assembly>ASSEMBLY_PATH</Assembly>
              <AddInId>D31A3D1A-4C26-4C95-9C5C-7E2D02C0A101</AddInId>
              <FullClassName>RevitSleeveAddin.Command</FullClassName>
              <VendorId>AMDG</VendorId>
              <VendorDescription>BIM Tools - Revit Sleeve Tools</VendorDescription>
            </AddIn>
          </RevitAddIns>
          '@
          `$documentation = @'
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <RevitAddIns>
            <AddIn Type="Command">
              <Name>Revit Sleeve Tools - Documentation</Name>
              <Assembly>ASSEMBLY_PATH</Assembly>
              <AddInId>D31A3D1A-4C26-4C95-9C5C-7E2D02C0A102</AddInId>
              <FullClassName>RevitSleeveDocumentation.Command</FullClassName>
              <VendorId>AMDG</VendorId>
              <VendorDescription>BIM Tools - Revit Sleeve Tools</VendorDescription>
            </AddIn>
          </RevitAddIns>
          '@
          `$creation.Replace('ASSEMBLY_PATH', [System.Security.SecurityElement]::Escape(`$creationAssembly)) | Set-Content (Join-Path `$target 'RevitSleeveTools-Create.addin') -Encoding UTF8
          `$documentation.Replace('ASSEMBLY_PATH', [System.Security.SecurityElement]::Escape(`$docAssembly)) | Set-Content (Join-Path `$target 'RevitSleeveTools-Documentation.addin') -Encoding UTF8
          Write-Host "Installed Revit Sleeve Tools for Revit `$version to `$target"
          "@ | Set-Content (Join-Path $package 'Install-RevitSleeveTools.ps1') -Encoding UTF8
          @"
          Revit Sleeve Tools - Revit $version
          ==================================
          Files:
          - RevitSleeveAddin.dll
          - RevitSleeveDocumentation.dll
          - Install-RevitSleeveTools.ps1

          Installation:
          1. Close Revit.
          2. Extract this artifact to a local folder.
          3. Open PowerShell in that folder and run:
             powershell.exe -ExecutionPolicy Bypass -File .\Install-RevitSleeveTools.ps1
          4. Start Revit $version. The installer creates both .addin manifests in:
             %APPDATA%\Autodesk\Revit\Addins\$version

          The creation command requires the WallOpening_Round and WallOpening_Rectangular
          families to be loaded in the project. Build artifacts are compiled for Revit $version.
          "@ | Set-Content (Join-Path $package 'README-INSTALL.txt') -Encoding UTF8

      - name: Upload compiled DLLs and add-in installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RevitSleeveTools-Revit-${{ matrix.revit-version }}
          path: artifacts/RevitSleeveTools-Revit-${{ matrix.revit-version }}/*
          if-no-files-found: error
          retention-days: 90
